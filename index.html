<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CineMatch | Descubra séries que combinam com você</title>
    <meta 
        name="description"
        content="CineMatch ajuda você a descobrir séries e comparar a compatibilidade entre perfis com base em seus gêneros favoritos."
    >
    <meta 
        property="og:title" 
        content="CineMatch | Descubra séries que combinam com você"
    >
    <meta 
        property="og:description" 
        content="Encontre séries e compare a compatibilidade entre perfis com base em seus gêneros favoritos."
    >
</head>
<body>
    <header>
        <a href="/" aria-label="CineMatch - Página Inicial">
            CineMatch
        </a>
    </header>
    <main>
        <h1>Encontre séries que combinam com você</h1>
        <section aria-labelledby="perfil-titulo">
            <h2 id="perfil-titulo">Crie seu perfil</h2>
            <form id="form-perfil">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade" min="1" required>
                <fieldset>
                    <legend>Gêneros favoritos</legend>
                    <label>
                        <input type="checkbox" name="genero" value="Drama">
                        Drama
                    </label>
                    <label>
                        <input type="checkbox" name="genero" value="Comedy">
                        Comédia
                    </label>
                    <label>
                        <input type="checkbox" name="genero" value="Action">
                        Ação
                    </label>
                </fieldset>
                <button type="submit">Ver recomendações</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 CineMatch</p>
    </footer>
</body>
</html>
